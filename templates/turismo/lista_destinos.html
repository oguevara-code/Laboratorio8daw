<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinos</title>
</head>
<body>
    <h1>Destinos Turísticos del Perú</h1>

    <a href="{% url 'agregar_destino' %}">
        Agregar Nuevo Destino
    </a>

    <hr>

    <div>

        {% for destino in destinos %}

            <div style="border:1px solid #ccc; margin:10px; padding:10px;">

                <h2>{{ destino.nombreCiudad }}</h2>

                <p>{{ destino.descripcionCiudad }}</p>

                <img src="{{ destino.imagenCiudad }}" width="300">

                <p>Precio: S/. {{ destino.precioTour }}</p>

                {% if destino.ofertaTour %}
                    <p style="color:green;"> EN OFERTA</p>
                {% else %}
                    <p style="color:red;">Sin oferta</p>
                {% endif %}

                <a href="{% url 'editar_destino' destino.id %}">
                    Editar
                </a>

                |

                <a href="{% url 'eliminar_destino' destino.id %}">
                    Eliminar
                </a>

            </div>

        {% endfor %}

    </div>
</body>
</html>
