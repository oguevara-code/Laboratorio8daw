{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Destino</title>
</head>
<body>
    <h1>Editar Destino Turístico</h1>

    <div class="contenedor">

        <div class="card">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-editar">
                    Guardar Cambios
                </button>

            </form>

        </div>

    </div>
</body>
</html>
